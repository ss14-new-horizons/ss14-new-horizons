- type: job
  id: ChiefEngineer
  name: job-name-ce
  description: job-description-ce
  playTimeTracker: JobChiefEngineer
  requireAdminNotify: true # NH-Add (Job rework)
  requirements:
    - !type:RoleTimeRequirement
      role: JobAtmosphericTechnician
      time: 10h # Corvax-RoleTime 2.5h
    # NH-Add-Start (Job rework, uncommented StationEngineer requirement)
    - !type:RoleTimeRequirement
      role: JobStationEngineer
      time: 5h
    # NH-Add-End
    - !type:DepartmentTimeRequirement
      department: Engineering
      time: 20h # Corvax-RoleTime 10h # NH-Tweak (15h)
    # NH-Add-Start (Job rework, uncommented OverallPlaytimeRequirement)
    - !type:OverallPlaytimeRequirement
      time: 40h
    # NH-Add-End
    - !type:TraitsRequirement #Corvax-TraitsRequirement
      inverted: true
      traits:
      - Muted
    # NH-Add-Start (Job rework)
    - !type:AgeRequirement
      requiredAge: 24
    # NH-Add-End
  startingGear: ChiefEngineerGear
  icon: "JobIconChiefEngineer"
  supervisors: job-supervisors-captain
  guides: [ Command ] # TODO: should have a more specific guidebook page instead of using the department itself
  access:
  - Maintenance
  - Engineering
  - Command
  - External
  - ChiefEngineer
  - Atmospherics
  - Brig
  - Cryogenics
  special:
  - !type:AddImplantSpecial
    implants: [ MindShieldImplant ]
  - !type:AddComponentSpecial
    components:
      - type: CommandStaff

- type: startingGear
  id: ChiefEngineerGear
  equipment:
    id: CEPDA
    eyes: ClothingEyesGlassesMeson
    ears: ClothingHeadsetCE
    belt: ClothingBeltUtilityEngineering
  storage:
    back:
    - Flash

- type: chameleonOutfit
  id: ChiefEngineerChameleonOutfit
  job: ChiefEngineer
  hasMindShield: true
  equipment:
    head: ClothingHeadHatBeretEngineering
    mask: ClothingMaskBreath
    neck: ClothingNeckCloakCe
    outerClothing: ClothingOuterWinterCE
    gloves: ClothingHandsGlovesColorYellow
    shoes: ClothingShoesBootsMagAdv
