- type: job
  id: ResearchDirector
  name: job-name-rd
  description: job-description-rd
  playTimeTracker: JobResearchDirector
  requireAdminNotify: true # NH-Add (Job rework)
  requirements:
    # NH-Add-Start (Job rework, uncommented Scientist requirement)
    - !type:RoleTimeRequirement
      role: JobScientist
      time: 5h
    # NH-Add-End
    - !type:DepartmentTimeRequirement
      department: Science
      time: 20h # Corvax-RoleTime 10 # NH-Tweak (15h)
    # NH-Add-Start (Job rework, uncommented OverallPlaytimeRequirement)
    - !type:OverallPlaytimeRequirement
      time: 40h
    # NH-Add-End
    - !type:TraitsRequirement #Corvax-TraitsRequirement
      inverted: true
      traits:
      - Muted
    # NH-Add-Start (Job rework)
    - !type:AgeRequirement
      requiredAge: 24
    # NH-Add-End
  startingGear: ResearchDirectorGear
  icon: "JobIconResearchDirector"
  supervisors: job-supervisors-captain
  guides: [ Command ] # TODO: should have a more specific guidebook page instead of using the department itself
  access:
  - Research
  - Command
  - Maintenance
  - ResearchDirector
  - Brig
  - Cryogenics
  special:
  - !type:AddImplantSpecial
    implants: [ MindShieldImplant ]
  - !type:AddComponentSpecial
    components:
      - type: CommandStaff

- type: startingGear
  id: ResearchDirectorGear
  equipment:
    id: RnDPDA
    ears: ClothingHeadsetRD
  storage:
    back:
    - Flash

- type: chameleonOutfit
  id: ResearchDirectorChameleonOutfit
  job: ResearchDirector
  hasMindShield: true
  equipment:
    head: ClothingHeadHatBeretRND
    eyes: ClothingEyesGlasses
    mask: ClothingMaskGas
    neck: ClothingNeckCloakRd
    outerClothing: ClothingOuterCoatRD
    gloves: ClothingHandsGlovesColorPurple
