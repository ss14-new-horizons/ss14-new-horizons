# Best job.

- type: job
  id: ChiefMedicalOfficer
  name: job-name-cmo
  description: job-description-cmo
  playTimeTracker: JobChiefMedicalOfficer
  requireAdminNotify: true # NH-Add (Job rework)
  requirements:
    - !type:RoleTimeRequirement
      role: JobChemist
      time: 5h # Corvax-RoleTime 2.5h
    # NH-Add-Start (Job rework, uncommented MedicalDoctor requirement)
    - !type:RoleTimeRequirement
      role: JobMedicalDoctor
      time: 5h
    # NH-Add-End
    - !type:DepartmentTimeRequirement
      department: Medical
      time: 20h # Corvax-RoleTime 10h # NH-Tweak (15h)
    # NH-Add-Start (Job rework, uncommented OverallPlaytimeRequirement)
    - !type:OverallPlaytimeRequirement
      time: 40h
    # NH-Add-End
    - !type:TraitsRequirement #Corvax-TraitsRequirement
      inverted: true
      traits:
      - Muted
    # NH-Add-Start (Job rework)
    - !type:AgeRequirement
      requiredAge: 24
    # NH-Add-End
  startingGear: CMOGear
  icon: "JobIconChiefMedicalOfficer"
  supervisors: job-supervisors-captain
  guides: [ Command ] # TODO: should have a more specific guidebook page instead of using the department itself
  access:
  - Medical
  - Command
  - Maintenance
  - Chemistry
  - ChiefMedicalOfficer
  - Brig
  - Cryogenics
  special:
  - !type:AddImplantSpecial
    implants: [ MindShieldImplant ]
  - !type:AddComponentSpecial
    components:
      - type: CommandStaff

- type: startingGear
  id: CMOGear
  equipment:
    id: CMOPDA
    ears: ClothingHeadsetCMO
  storage:
    back:
    - Flash

- type: chameleonOutfit
  id: ChiefMedicalOfficerChameleonOutfit
  job: ChiefMedicalOfficer
  hasMindShield: true
  equipment:
    head: ClothingHeadHatBeretCmo
    eyes: ClothingEyesHudMedical
    mask: ClothingMaskSterile
    neck: ClothingCloakCmo
    outerClothing: ClothingOuterCoatLabCmo
    gloves: ClothingHandsGlovesNitrile
