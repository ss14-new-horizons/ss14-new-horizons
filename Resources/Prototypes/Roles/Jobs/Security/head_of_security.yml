- type: job
  id: HeadOfSecurity
  name: job-name-hos
  description: job-description-hos
  playTimeTracker: JobHeadOfSecurity
  requireAdminNotify: true # NH-Add (Job rework)
  requirements:
    - !type:RoleTimeRequirement
      role: JobWarden
      time: 10h # Corvax-RoleTime 1
    # NH-Edit-Start (Job rework, uncommented removed requirements)
    - !type:RoleTimeRequirement
      role: JobDetective
      time: 1h # knowing how to use the tools is important
    - !type:RoleTimeRequirement
      role: JobSecurityOfficer
      time: 5h
    # NH-Edit-End
    - !type:DepartmentTimeRequirement
      department: Security
      time: 50h # Corvax-RoleTime 10
    - !type:TraitsRequirement #Corvax-TraitsRequirement
      inverted: true
      traits:
      - Muted
      # NH-Add-Start (Job rework, HoS undergoes medical examination)
      - Blindness
      - Pacifist
      # - WheelchairBound
      # - Frail
      # NH-Add-End
    # NH-Add-Start (Job rework)
    - !type:AgeRequirement
      requiredAge: 24
    - !type:SpeciesRequirement
      inverted: true
      species:
      - Vox
      - Diona
    # NH-Add-End
  startingGear: HoSGear
  icon: "JobIconHeadOfSecurity"
  supervisors: job-supervisors-captain
  guides: [ Command ] # TODO: should have a more specific guidebook page instead of using the department itself
  access:
  - HeadOfSecurity
  - Command
  - Brig
  - Security
  - Armory
  - Maintenance
  - External
  - Detective
  - Cryogenics
  - GenpopEnter
  - GenpopLeave
  special:
  - !type:AddImplantSpecial
    implants: [ MindShieldImplant ]
  - !type:AddComponentSpecial
    components:
      - type: CommandStaff

- type: startingGear
  id: HoSGear
  equipment:
    eyes: ClothingEyesGlassesSecurity
    id: HoSPDA
    gloves: ClothingHandsGlovesCombat
    ears: ClothingHeadsetAltSecurity
    pocket1: WeaponPistolMk58
  storage:
    back:
    - Flash
    - MagazinePistol

- type: chameleonOutfit
  id: HeadOfSecurityChameleonOutfit
  job: HeadOfSecurity
  hasMindShield: true
  equipment:
    head: ClothingHeadHatBeretHoS
    mask: ClothingMaskGasSecurity
    neck: ClothingNeckCloakHos
