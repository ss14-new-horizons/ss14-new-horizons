- type: job
  id: HeadOfPersonnel
  name: job-name-hop
  description: job-description-hop
  playTimeTracker: JobHeadOfPersonnel
  requireAdminNotify: true # NH-Add (Job rework)
  requirements:
    - !type:DepartmentTimeRequirement
      department: Service # NH-Edit (Engineering, Job rework)
      time: 5h # Corvax-RoleTime 2.5h
    # NH-Remove-Start (Job rework)
    # - !type:DepartmentTimeRequirement
    #   department: Medical
    #   time: 5h # Corvax-RoleTime 2.5h
    # - !type:DepartmentTimeRequirement
    #   department: Science
    #   time: 2.5h
    # NH-Remove-End
    - !type:DepartmentTimeRequirement
      department: Cargo # NH-Edit (Security, Job rework)
      time: 5h # Corvax-RoleTime 2.5h
    # NH-Add-Start (Job rework, uncommented Command requirement)
    - !type:DepartmentTimeRequirement
      department: Command
      time: 2.5h
    # NH-Add-End
    - !type:OverallPlaytimeRequirement
      time: 50h # Corvax-RoleTime
    - !type:TraitsRequirement #Corvax-TraitsRequirement
      inverted: true
      traits:
      - Muted
    # NH-Add-Start (Job rework)
    - !type:AgeRequirement
      requiredAge: 24
    # NH-Add-End
  startingGear: HoPGear
  icon: "JobIconHeadOfPersonnel"
  supervisors: job-supervisors-captain
  guides: [ Command ] # TODO: should have a more specific guidebook page instead of using the department itself
  access:
  - Command
  - HeadOfPersonnel
  - Bar
  - Service
  - Maintenance
  - Janitor
  - Theatre
  - Kitchen
  - Chapel
  - Hydroponics
  - External
  - Cryogenics
  # I mean they'll give themselves the rest of the access levels *anyways*.
  # As of 15/03/23 they can't do that so here's MOST of the rest of the access levels.
  # Head level access that isn't their own was deliberately left out, get AA from the captain instead.
  - Chemistry
  - Engineering
  - Research
  - Detective
  - Salvage
  - Security
  - Brig
  - Lawyer
  - Cargo
  - Atmospherics
  - Medical
  - GenpopEnter
  - GenpopLeave
  special:
  - !type:AddImplantSpecial
    implants: [ MindShieldImplant ]
  - !type:AddComponentSpecial
    components:
      - type: CommandStaff

