[game]
lobbyenabled = true
lobbyduration = 300
role_timers = true
# Pending space law and contra revision, set to true when ready
contraband_examine = false
contraband_examine_only_in_hud = true
maxplayers = 60
soft_max_players = 50
map_rotation = true
admin_job_tracking = true
# peaceful_end = true
# Use "NewHorizonsMapPool" when ready
map_pool = "CorvaxMapPool"
# Should be more for sponsors and whitelisted
# maxcharacterslots = 20
# fallbackpreset = "extended"
# For persistent events only
# usepersistence = true
# For persistent events only
# cryo_sleep_rejoining = true

[game.panic_bunker]
show_reason = true
min_account_age = 10
min_overall_minutes = 0
enable_without_admins = true
disable_with_admins = true

[ic]
flavor_text = true
punctuation = false

[ooc]
enable_during_round = false

[chat]
max_announcement_length = 512

[server]
lobby_name = "️SS14 New Horizons"
# rules_file = "NewHorizonsRuleset"
id = "newhorizons"

[atmos]
# May cause performance issues, pls exercise caution when enabling
# space_wind = true
# grid_impulse = true
space_wind_max_velocity = 22.0
max_explosion_range = 20.0

[movement]
# Set to true when we refactor it to work only in combat mode
# mob_pushing = true
minimum_push = 0.05

[shuttle]
# Set to false when we implement off-station NH gameplay
# arrivals = false
emergency_early_launch_allowed = true
arrivals_map = "/Maps/Corvax/Misc/corvax_terminal.yml"
auto_call_time = 0
auto_call_extension_time = 120
emergency_dock_time = 220

[vote]
same_type_timeout = 300.0
preset_enabled = true
restart_enabled = true
map_enabled = true
timerrestart = 30
timermap = 60
timerpreset = 60

# [chat]
# When we want to display a special greeting, info or warning message by default.
# motd = ""

[afk]
time = 3600
confirm_timeout = 180
# confirm_sound = ""

[ghost.go_lobby]
enabled = true

[admin]
admins_count_in_playercount = true
see_own_notes = true
deadmin_on_join = true
new_player_join_sound = true
new_player_threshold = 1440

[adminlogs]
# Name of the server within the admin logs.
# Recommended to be set to something unique between your servers if you have multiple to help with identifying them.
# Also used in some places to get the server name in a server family.
server_name = "newhorizons"

[ahelp]
admin_prefix = true

[infolinks]
github = "https://github.com/ss14-new-horizons/ss14-new-horizons"

# [discord]
# We'll get it eventually
# rich_main_icon_id = "newhorizons"

[build]
fork_id = "newhorizons"
# download_url = ""

[hub]
tags = "lang:ru,rp:high,region:eu_e"
