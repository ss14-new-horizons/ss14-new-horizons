  changes:
  - message: "Возвращён рецепт амбузола плюс в усложнённом виде - теперь он требует не только омнизина, но также оппорозидона и криптобиолина."
    type: Add
  - message: "Химический состав пены теперь можно изучить при осмотре в очках химического анализа."
    type: Add
  - message: "В КПК старшего инженера добавлены программы Астронав и Зонд сетей."
    type: Add
  - message: "В Инжемат добавлены счётчики гейгера. В Библиодроб добавлены ручки."
    type: Add
  - message: "В шкафчик главного врача добавлен мобильный дефибриллятор."
    type: Add
  - message: "Во все хранилища скафандров к баллону кислорода добавлен баллон азота."
    type: Add
  - message: "Лазерному карабину и лазерной пушке был немного увеличен боезапас. Точность лазерного карабина в одной руке теперь немного лучше."
    type: Tweak
  - message: "Добавлены небольшие резисты к стамина-урону и к шансу заражения для соответствующей защитной экипировки."
    type: Tweak
  - message: "Скафандр бригмедика получил 20% устойчивости к кислотному и 10% устойчивости к высокотемпературному урону. Скафандр старшего инженера получил 30% устойчивости к электрическому урону."
    type: Tweak
  - message: "Тяжёлая верхняя одежда теперь надевается и снимается с задержкой."
    type: Tweak
  - message: "Скафандры теперь блокируют взаимодействие со слотами комбинезона, обуви и перчаток, а шлемы скафандров блокируют взаимодействие со слотами ушей, очков и маски."
    type: Tweak
  - message: "Существа в боевом режиме теперь вращаются плавно."
    type: Tweak
  - message: "Дифенилметиламин теперь эффективнее против нарколепсии."
    type: Tweak
  - message: "Нианы теперь могут есть цветы."
    type: Tweak
  - message: "Поедание ткани и одежды теперь занимает больше времени."
    type: Tweak
  - message: "Уменьшен хитбокс большого генератора гравитации сверху."
    type: Tweak
  - message: "Время открытия бронированной двери ломом немного увеличено."
    type: Tweak
  - message: "Таймеры требований времени для большинства ролей были изменены, чтобы лучше подходить под особенности сервера."
    type: Tweak
  - message: "Младшие роли теперь могут становиться стандартными антагонистами."
