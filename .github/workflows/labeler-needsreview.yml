name: "Labels: Review"

on:
  pull_request_target:
    types: [review_requested, opened]

jobs:
  add_label:
    runs-on: ubuntu-latest
    steps:
    - uses: actions-ecosystem/action-add-labels@v1
      with:
        labels: "Ст: Ожидает рассмотрения"
    - uses: actions-ecosystem/action-remove-labels@v1
      with:
        labels: "Ст: Ожидает изменений"
