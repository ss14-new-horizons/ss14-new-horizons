name: "Labels: Branch staging"

on:
  pull_request_target:
    types:
      - opened
    branches:
      - 'staging'
      - 'testing'
      - 'test'
      - 'beta'
      - 'experimental'
      - 'event'
      - 'upstream'
      - 'unstable'

jobs:
  add_label:
    runs-on: ubuntu-latest
    steps:
    - uses: actions-ecosystem/action-add-labels@v1
      with:
        labels: "Ветка: Тестовая"
